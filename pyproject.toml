[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-wallpaper"
version = "2.1.0"
description = "Grok Surprise Wallpaper Rotator — daily GTM / literary / painting wallpapers for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Local" }]
dependencies = [
  "windows-toasts>=1.3.0",
  "tzdata>=2024.1",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
# After: pip install -e .
# Usage:  wallpaper --new | wallpaper next | wallpaper reject | ...
wallpaper = "wallpaper:main"

[tool.setuptools]
py-modules = ["wallpaper"]
packages = ["rotator"]

[tool.setuptools.package-data]
rotator = ["py.typed"]
